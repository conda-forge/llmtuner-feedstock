schema_version: 1

context:
  name: llmtuner
  version: "0.9.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/hiyouga/LLaMA-Factory/archive/v${{ version }}.tar.gz
  sha256: 363b749a5f3574f837f784a02f5ada4ea4b53309b635b92af033253d41138348

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - hf-transfer
    - modelscope
    - safetensors
    - torchaudio >=2.4.0
    - torchdata >=0.10.0,<=0.11.0
    - torchvision >=0.19.0
    - omegaconf
    - librosa
    - tokenizers >=0.19.0,<=0.21.1
    - av >=10.0.0,<=16.0.0
    - numpy
    - pandas
    - tyro <0.9.0
    - pyyaml
    - packaging
    - python >=${{ python_min }}
    - pytorch >=2.4.0
    - transformers >=4.55.0,<=5.6.0,!=4.52.0,!=4.57.0
    - datasets >=2.16.0,<=4.0.0
    - accelerate >=1.3.0,<=1.11.0
    - peft >=0.18.0,<=0.18.1
    - trl >=0.18.0,<=0.24.0
    - gradio >=4.38.0,<=5.50.0
    - scipy
    - einops
    - sentencepiece
    - protobuf
    - uvicorn
    - pydantic
    - fastapi
    - sse-starlette
    - matplotlib-base >=3.7.0
    - fire
    - galore-torch
    - tiktoken
    - eval-type-backport

tests:
  - python:
      imports:
        - llamafactory
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Easy-to-use LLM fine-tuning framework
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/hiyouga/LLaMA-Factory

extra:
  recipe-maintainers:
    - shaowei-su
    - jan-janssen
